name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert OpenClaw paid funnel artifact
        run: |
          test -f openclaw-mac-ai-workstation-setup/agent-safety-diagnostic.html
          grep -F "OpenClaw Agent Safety Diagnostic" openclaw-mac-ai-workstation-setup/agent-safety-diagnostic.html
          grep -F "data-track=\"checkout_click\"" openclaw-mac-ai-workstation-setup/agent-safety-diagnostic.html
          grep -F "/openclaw-agent-safety-diagnostic.html" openclaw-mac-ai-workstation-setup/index.html
          grep -F "/openclaw-agent-safety-diagnostic.html" openclaw-mac-ai-workstation-setup/troubleshooting.html
          grep -F "/openclaw-agent-safety-sample.html" index.html
          grep -F "/openclaw-agent-safety-sample.html" openclaw-agent-safety-diagnostic.html
          grep -F "data-track=\"sample_click\"" index.html
          grep -F "data-track=\"checkout_click\"" openclaw-agent-safety-sample.html
          grep -F "/openclaw-agent-safety-diagnostic.html" openclaw-mac-ai-workstation-setup/quick-read.html
          grep -F "home_topbar_openclaw_agent_safety_diagnostic" index.html

      - name: Stage static site
        run: |
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '_site' \
            --exclude '.github' \
            ./ _site/

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
