<body>
    <h1>ApplyOps Intake Form</h1>
    <p>Welcome! Please provide the details below to start your Resume Truth Audit.</p>
    
    <form action="mailto:iganapolsky@gmail.com" method="post" enctype="text/plain">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label for="linkedin">LinkedIn URL</label>
        <input type="url" id="linkedin" name="linkedin" required>

        <label for="roles">Target Role Titles</label>
        <input type="text" id="roles" name="roles" placeholder="e.g. Senior AI Engineer, Product Manager" required>

        <label for="resume">Link to Current Resume (Google Drive/Dropbox)</label>
        <input type="url" id="resume" name="resume" required>
        <p class="note">Ensure the link is viewable by anyone with the link.</p>

        <label for="jobs">3-5 Job Postings You're Targeting</label>
        <textarea id="jobs" name="jobs" rows="4" placeholder="Paste URLs here..." required></textarea>

        <label for="constraints">Any specific constraints? (Location, Salary, etc.)</label>
        <textarea id="constraints" name="constraints" rows="2"></textarea>

        <button type="submit">Submit Intake & Start Audit</button>
    </form>

    <footer>
        <p><small>Privacy Note: We do not store high-risk PII (SSN, DOB). Data is used only for fulfillment of your ApplyOps audit.</small></p>
    </footer>
