<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApplyOps - Buyer Intake</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 600px;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        color: #000;
      }
      form {
        background: #f9f9f9;
        padding: 1.5rem;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 0.5rem;
        margin-bottom: 1.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        background: #007aff;
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        width: 100%;
      }
      button:hover {
        background: #0056b3;
      }
      .note {
        font-size: 0.8rem;
        color: #666;
        margin-top: -1rem;
        margin-bottom: 1rem;
      }
    </style>
    <script
      defer
      data-domain="igorganapolsky.github.io"
      src="https://plausible.io/js/script.tagged-events.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-SZR5039QN4"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-SZR5039QN4");
    </script>
  </head>
  <body>
    <h1>ApplyOps Intake Form</h1>
    <p>
      Welcome! Please provide the details below to start your Resume Truth
      Audit.
    </p>

    <form
      action="mailto:iganapolsky@gmail.com"
      method="post"
      enctype="text/plain"
    >
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />

      <label for="linkedin">LinkedIn URL</label>
      <input type="url" id="linkedin" name="linkedin" required />

      <label for="roles">Target Role Titles</label>
      <input
        type="text"
        id="roles"
        name="roles"
        placeholder="e.g. Senior AI Engineer, Product Manager"
        required
      />

      <label for="resume">Link to Current Resume (Google Drive/Dropbox)</label>
      <input type="url" id="resume" name="resume" required />
      <p class="note">Ensure the link is viewable by anyone with the link.</p>

      <label for="jobs">3-5 Job Postings You're Targeting</label>
      <textarea
        id="jobs"
        name="jobs"
        rows="4"
        placeholder="Paste URLs here..."
        required
      ></textarea>

      <label for="constraints"
        >Any specific constraints? (Location, Salary, etc.)</label
      >
      <textarea id="constraints" name="constraints" rows="2"></textarea>

      <button type="submit">Submit Intake & Start Audit</button>
    </form>

    <footer>
      <p>
        <small
          >Privacy Note: We do not store high-risk PII (SSN, DOB). Data is used
          only for fulfillment of your ApplyOps audit.</small
        >
      </p>
    </footer>
  </body>
</html>
